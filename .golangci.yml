version: "2"
run:
  concurrency: 4
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 200
    gocyclo:
      min-complexity: 30
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: superfluous-else
          disabled: true
        - name: exported
          disabled: true
        - name: context-keys-type
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        text: weak cryptographic primitive
      - linters:
          - gosec
        path: pkg/syncer/pubsub/redis.*\.go
        text: G104
      - linters:
          - staticcheck
        text: SA1029
      - linters:
          - staticcheck
        text: ST1020|ST1021
      - linters:
          - nakedret
        path: plugins/userprofileservice/services/rest_ups\.go
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
