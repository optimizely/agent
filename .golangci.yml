linters-settings:
  govet:
    enable:
      - shadow
  gocyclo:
    min-complexity: 30  # Increased to allow existing complex functions
  dupl:
    threshold: 200
  misspell:
    locale: US
  revive:
    min-confidence: 0
    rules:
      # Disabled: Would require breaking API changes (Ids -> IDs)
      - name: var-naming
        disabled: true
      # Disabled: Parameters often required for interface compliance
      - name: unused-parameter
        disabled: true
      # Disabled: Style preference, not a bug
      - name: superfluous-else
        disabled: true
      # Disabled: Would require breaking API changes (stuttering names)
      - name: exported
        disabled: true
      # Disabled: Style preference for context key types
      - name: context-keys-type
        disabled: true

linters:
  disable-all: true
  enable:
    - unused
    - dupl
    - gosec
    # - gocritic  # Temporarily disabled due to compatibility issues with Go 1.24
    - gocyclo
    - revive
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - nakedret
    - prealloc
    - copyloopvar
    - stylecheck
    - typecheck
    - unconvert
    - unparam

run:
  concurrency: 4
  # The dependency graph grew (otel v1.45, grpc v1.83) and the Go 1.26 toolchain
  # makes the first uncached analysis slower, exceeding golangci-lint's default
  # 1m timeout. Raise it.
  timeout: 5m
  # The module now builds with the Go 1.26 toolchain (see go.mod), but the
  # pinned golangci-lint v1.64.2 is built with Go 1.24 and refuses to analyze a
  # module targeting a newer Go. The code uses no post-1.24 language features,
  # so we pin the analysis target to 1.24. Drop this once golangci-lint is
  # upgraded to a v2 release built with Go 1.26+.
  go: "1.24"

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - text: "weak cryptographic primitive"
      linters:
        - gosec
    # Suppress unhandled errors in Redis cleanup code (non-critical)
    - path: pkg/syncer/pubsub/redis.*\.go
      linters:
        - gosec
      text: "G104"
    # Suppress context key type warnings (would require refactoring)
    - linters:
        - staticcheck
      text: "SA1029"
    # Suppress comment format warnings (style preference)
    - linters:
        - stylecheck
      text: "ST1020|ST1021"
    # Suppress naked return warnings in rest_ups.go (existing code, refactoring is risky)
    - path: plugins/userprofileservice/services/rest_ups\.go
      linters:
        - nakedret
  exclude-use-default: false
